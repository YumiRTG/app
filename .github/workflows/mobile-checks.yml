name: Mobile checks
on:
  pull_request:
  push:
    branches: [main, fix/mobile-live]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:reports
      - run: npm run test:mobile
      - run: npm run build
