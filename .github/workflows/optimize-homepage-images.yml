name: Optimize Homepage Images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-homepage-images.yml'
      - 'public/banner-bg.png'
      - 'public/dino-tyranno.png'
      - 'public/dino-raptor.png'
      - 'public/dino-triceratops.png'
      - 'public/dino-dilo.png'
      - 'public/dino-stego.png'
      - 'public/dino-allo.png'
      - 'public/dino-ptera.png'
      - 'public/dino-dragon.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate optimized WebP assets
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          public = Path('public')
          output = public / 'optimized'
          output.mkdir(parents=True, exist_ok=True)

          files = [
              'banner-bg.png',
              'dino-tyranno.png',
              'dino-raptor.png',
              'dino-triceratops.png',
              'dino-dilo.png',
              'dino-stego.png',
              'dino-allo.png',
              'dino-ptera.png',
              'dino-dragon.png',
          ]

          total_before = 0
          total_after = 0

          for name in files:
              src = public / name
              if not src.exists():
                  raise SystemExit(f'Missing source image: {src}')

              is_background = name == 'banner-bg.png'
              max_side = 1600 if is_background else 1200
              quality = 82 if is_background else 86
              dst = output / f'{src.stem}.webp'

              with Image.open(src) as im:
                  im.load()
                  if im.mode not in ('RGB', 'RGBA'):
                      im = im.convert('RGBA' if 'transparency' in im.info else 'RGB')
                  im.thumbnail((max_side, max_side), Image.Resampling.LANCZOS)
                  im.save(dst, 'WEBP', quality=quality, method=5)

              before = src.stat().st_size
              after = dst.stat().st_size
              total_before += before
              total_after += after
              print(f'{name}: {before / 1024:.0f} KB -> {after / 1024:.0f} KB')

          saving = 100 * (1 - total_after / total_before) if total_before else 0
          print(f'Homepage images: {total_before / 1024 / 1024:.1f} MB -> {total_after / 1024 / 1024:.1f} MB ({saving:.1f}% smaller)')
          PY

      - name: Commit optimized assets
        shell: bash
        run: |
          if git status --short public/optimized | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/optimized
            git commit -m 'Add optimized homepage WebP assets'
            git push
          else
            echo 'Optimized assets already up to date.'
          fi
