name: Apply Homepage Cleanup

on:
  push:
    paths:
      - '.github/workflows/apply-homepage-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/pages/HomePage.tsx')
          s = p.read_text()
          s = s.replace("import { useState } from 'react'\n", "")
          s = s.replace("  const [introToken, setIntroToken] = useState(0)\n", "")
          s = s.replace("<HomeIntro replayToken={introToken} />", "<HomeIntro replayToken={0} />")
          s = re.sub(r'\n\s*<button\s+type="button"\s+className="home-exp-replay".*?</button>\n', '\n', s, flags=re.S)
          p.write_text(s)

          p = Path('src/sections/Navigation.tsx')
          s = p.read_text().replace("  { label: 'Story', to: '/story' },\n", "")
          p.write_text(s)

          p = Path('src/components/HomeModesNetworkPortal.tsx')
          s = p.read_text()
          if "import { Link } from 'react-router'" not in s:
              s = s.replace("import { createPortal } from 'react-dom'\n", "import { createPortal } from 'react-dom'\nimport { Link } from 'react-router'\n")
          s = re.sub(r'\nfunction pageHref\(path: string\) \{.*?\n\}\n', '\n', s, flags=re.S)
          s = s.replace("            <a\n              key={item.key}\n              href={pageHref(item.to)}", "            <Link\n              key={item.key}\n              to={item.to}")
          s = s.replace("              <b className=\"home-command-node__open\">OPEN ↗</b>\n            </a>\n          ))}", "              <b className=\"home-command-node__open\">OPEN ↗</b>\n            </Link>\n          ))}")
          s = s.replace('<a href={pageHref(feature.to)}>ENTER FEATURE ↗</a>', '<Link to={feature.to}>ENTER FEATURE ↗</Link>')
          p.write_text(s)

          p = Path('src/pages/PartnerSystemPage.tsx')
          s = p.read_text().replace('className="page-shell"', 'className="page-shell partner-system-page"', 1)
          p.write_text(s)
          PY

          MARKER='/* FINAL PARTNER STATE: violet, no white active/click treatment */'
          if ! grep -Fq "$MARKER" src/components/HomeModesNetworkPortalFix.css; then
            echo '' | base64 -d >> src/components/HomeModesNetworkPortalFix.css
          fi

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-homepage-cleanup.yml
          git add src/pages/HomePage.tsx src/sections/Navigation.tsx src/components/HomeModesNetworkPortal.tsx src/components/HomeModesNetworkPortalFix.css src/pages/PartnerSystemPage.tsx
          git commit -m "Clean homepage nav and stabilize Partner states"
          git push origin HEAD:main
